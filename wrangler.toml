# Cloudflare configuration for Astro Rocket

name = "astro-rocket"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-10-05"

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
RESEND_FROM_EMAIL = "contato@israelreispereira.com.br"
SITE_URL = "https://israelreispereira.com.br"
SITE_URL_FALLBACK = "https://israelreispereira.com.br"